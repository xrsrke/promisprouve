<style>
  :root {
    --bg: #fafaf7;
    --ink: #111111;
    --muted: #6b6b66;
    --rule: #d8d6ce;
    --bleu: #0055A4;
    --blanc: #FFFFFF;
    --rouge: #EF4135;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
  }

  /* Tricolore stripes — kept clean, no content layered on top */
  .stripes {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: clamp(140px, 24vw, 520px) 1fr clamp(140px, 24vw, 520px);
    z-index: 0;
    pointer-events: none;
  }
  .stripes > div:nth-child(1) { background: var(--bleu); }
  .stripes > div:nth-child(2) {
    background: var(--bg);
    border-left: 1px solid rgba(0,0,0,0.08);
    border-right: 1px solid rgba(0,0,0,0.08);
  }
  .stripes > div:nth-child(3) { background: var(--rouge); }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 72px 24px;
    padding-top: max(72px, env(safe-area-inset-top));
    padding-bottom: max(96px, calc(env(safe-area-inset-bottom) + 72px));
  }

  .mark {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .mark::before,
  .mark::after {
    content: "";
    width: 32px;
    height: 1px;
    background: var(--rule);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(44px, 7vw, 108px);
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 0;
    max-width: 16ch;
    text-wrap: balance;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--muted);
    display: block;
    margin-top: 0.05em;
  }

  .lede {
    font-size: clamp(14px, 1.8vw, 17px);
    line-height: 1.55;
    color: #333;
    margin: 36px auto 0;
    max-width: 44ch;
    text-wrap: balance;
  }

  /* Candidates — a compact row inside the cream center, never touching the stripes */
  .candidates {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: clamp(14px, 2.4vw, 32px);
    margin-top: 48px;
    width: 100%;
    max-width: 440px;
  }

  .candidate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .portrait {
    width: clamp(48px, 5.4vw, 68px);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--rule);
    position: relative;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: grayscale(1) contrast(1.04);
    display: block;
  }

  .name {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(12px, 1vw, 14px);
    letter-spacing: -0.005em;
    line-height: 1.2;
    color: var(--ink);
  }

  .party {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .vs {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(11px, 0.95vw, 13px);
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .footer-mark {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 3;
    text-align: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 16px;
  }

  .credits-link {
    position: fixed;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 3;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity .15s ease;
  }
  .credits-link:hover { opacity: 1; }

  /* Mobile portrait: flip tricolore to top/bottom bands */
  @media (max-width: 640px) {
    :root { --band: 44px; }

    .stripes {
      grid-template-columns: 1fr;
      grid-template-rows: var(--band) 1fr var(--band);
    }
    .stripes > div:nth-child(2) {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    main {
      padding: calc(var(--band) + 28px) 20px calc(var(--band) + 64px);
      padding-top: calc(var(--band) + 28px + env(safe-area-inset-top));
    }

    h1 {
      font-size: clamp(40px, 11vw, 60px);
      letter-spacing: -0.025em;
    }
    .mark {
      font-size: 10px;
      letter-spacing: 0.18em;
      margin-bottom: 20px;
    }
    .mark::before, .mark::after { width: 20px; }
    .lede {
      font-size: 15px;
      margin-top: 24px;
      max-width: 36ch;
    }
    .candidates {
      margin-top: 32px;
      gap: 14px;
      max-width: 300px;
    }
    .portrait { width: 48px; }
    .name { font-size: 12px; }
    .party { font-size: 9px; }
    .vs { font-size: 11px; }
    .footer-mark {
      bottom: calc(var(--band) + 14px + env(safe-area-inset-bottom));
      font-size: 9px;
      letter-spacing: 0.24em;
    }
    .credits-link {
      bottom: calc(var(--band) + 14px + env(safe-area-inset-bottom));
      right: 16px;
      font-size: 9px;
      letter-spacing: 0.14em;
    }
  }

  /* Short landscape phones */
  @media (max-height: 620px) and (max-width: 900px) {
    main {
      min-height: auto;
      padding-top: 48px;
      padding-bottom: 72px;
    }
    body { min-height: 100vh; }
    .footer-mark { position: static; margin-top: 24px; padding: 16px; }
    .candidates { margin-top: 32px; }
  }
</style>
</head>

</div>

<main>
  <span class="mark">Présidentielle · 2027</span>
  <h1>Ils l'affirment.<em>On vérifie.</em></h1>
  <p class="lede">
    Vérification indépendante des affirmations des candidats à l'élection présidentielle française de 2027.
  </p>

    <div class="candidate candidate--left">
      <div class="portrait">

      </div>
      <div class="name">Marine Le Pen</div>
      <div class="party">RN</div>
    </div>
    <div class="vs">vs</div>
    <div class="candidate candidate--right">
      <div class="portrait">
        <img src="img/jean-luc-melenchon.jpg" alt="Jean-Luc Mélenchon" loading="lazy" decoding="async">
      </div>
      <div class="name">Jean-Luc Mélenchon</div>
      <div class="party">LFI</div>
    </div>
  </div>
</main>

<div class="footer-mark">Liberté · Égalité · Fraternité</div>
<a class="credits-link" href="CREDITS.md">Crédits</a>
