<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promis, prouvé</title>
<meta name="description" content="Vérification des affirmations des candidats à l'élection présidentielle française de 2027.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'%3E%3Crect width='1' height='2' x='0' fill='%230055A4'/%3E%3Crect width='1' height='2' x='1' fill='%23FFFFFF'/%3E%3Crect width='1' height='2' x='2' fill='%23EF4135'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --ink: #111111;
    --muted: #6b6b66;
    --rule: #d8d6ce;
    --bleu: #0055A4;
    --blanc: #FFFFFF;
    --rouge: #EF4135;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
  }

  /* Tricolore stripes — closer to real flag proportions (roughly 1 : 1.3 : 1) */
  .stripes {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: clamp(140px, 24vw, 520px) 1fr clamp(140px, 24vw, 520px);
    z-index: 0;
    pointer-events: none;
  }
  .stripes > div:nth-child(1) { background: var(--bleu); }
  .stripes > div:nth-child(2) {
    background: var(--bg);
    border-left: 1px solid rgba(0,0,0,0.08);
    border-right: 1px solid rgba(0,0,0,0.08);
  }
  .stripes > div:nth-child(3) { background: var(--rouge); }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 72px 24px;
    padding-top: max(72px, env(safe-area-inset-top));
    padding-bottom: max(96px, calc(env(safe-area-inset-bottom) + 72px));
  }

  .mark {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .mark::before,
  .mark::after {
    content: "";
    width: 32px;
    height: 1px;
    background: var(--rule);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: clamp(44px, 8vw, 120px);
    line-height: 0.98;
    letter-spacing: -0.03em;
    margin: 0;
    max-width: 16ch;
    text-wrap: balance;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--muted);
    display: block;
    margin-top: 0.05em;
  }

  .lede {
    font-size: clamp(14px, 1.8vw, 17px);
    line-height: 1.55;
    color: #333;
    margin: 36px auto 0;
    max-width: 44ch;
    text-wrap: balance;
  }

  .footer-mark {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 2;
    text-align: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 16px;
  }

  /* Tablet */
  @media (max-width: 900px) {
    .mark { margin-bottom: 28px; }
    .lede { margin-top: 28px; }
  }

  /* Mobile portrait: flip tricolore to top/bottom bands — more legible on narrow screens */
  @media (max-width: 640px) {
    :root { --band: 44px; }

    .stripes {
      grid-template-columns: 1fr;
      grid-template-rows: var(--band) 1fr var(--band);
    }
    .stripes > div:nth-child(1) { background: var(--bleu); }
    .stripes > div:nth-child(2) {
      background: var(--bg);
      border: none;
      border-top: 1px solid rgba(0,0,0,0.08);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .stripes > div:nth-child(3) { background: var(--rouge); }

    main {
      padding: calc(var(--band) + 32px) 22px calc(var(--band) + 72px);
      padding-top: calc(var(--band) + 32px + env(safe-area-inset-top));
    }

    h1 {
      font-size: clamp(40px, 12vw, 64px);
      letter-spacing: -0.025em;
    }

    .mark {
      font-size: 10px;
      letter-spacing: 0.18em;
      margin-bottom: 24px;
    }
    .mark::before, .mark::after { width: 20px; }

    .lede {
      font-size: 15px;
      margin-top: 24px;
      max-width: 36ch;
    }

    .footer-mark {
      bottom: calc(var(--band) + 14px + env(safe-area-inset-bottom));
      font-size: 9px;
      letter-spacing: 0.24em;
    }
  }

  /* Very short landscape phones: let content scroll rather than crush */
  @media (max-height: 520px) {
    main {
      min-height: auto;
      padding-top: 48px;
      padding-bottom: 72px;
    }
    body { min-height: 100vh; }
    .footer-mark { position: static; margin-top: 24px; padding: 16px; }
  }
</style>
</head>
<body>

<div class="stripes" aria-hidden="true">
  <div></div><div></div><div></div>
</div>

<main>
  <span class="mark">Présidentielle · 2027</span>
  <h1>Ils l'affirment.<em>On vérifie.</em></h1>
  <p class="lede">
    Vérification indépendante des affirmations des candidats à l'élection présidentielle française de 2027.
  </p>
</main>

<div class="footer-mark">Liberté · Égalité · Fraternité</div>

</body>
</html>
